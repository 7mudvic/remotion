<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>10 شعارات AI</title>
<style>
  body { background:#111; color:#fff; font-family: system-ui, sans-serif; margin:0; padding:40px; }
  h1 { text-align:center; font-weight:300; letter-spacing:2px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:24px; max-width:1200px; margin:40px auto; }
  .card { background:#000; border:1px solid #222; border-radius:12px; padding:16px; text-align:center; transition:transform .2s; }
  .card:hover { transform:scale(1.05); border-color:#fff; }
  .card img { width:100%; height:auto; display:block; }
  .name { margin-top:12px; font-size:14px; opacity:.7; letter-spacing:1px; }
</style>
</head>
<body>
<h1>· AI LOGO COLLECTION ·</h1>
<div class="grid">
  <div class="card"><img src="01-nexus-orbit.svg"><div class="name">NEXUS ORBIT</div></div>
  <div class="card"><img src="02-neural-mesh.svg"><div class="name">NEURAL MESH</div></div>
  <div class="card"><img src="03-infinity-spark.svg"><div class="name">INFINITY SPARK</div></div>
  <div class="card"><img src="04-prism-core.svg"><div class="name">PRISM CORE</div></div>
  <div class="card"><img src="05-vortex-mind.svg"><div class="name">VORTEX MIND</div></div>
  <div class="card"><img src="06-pulse-wave.svg"><div class="name">PULSE WAVE</div></div>
  <div class="card"><img src="07-eye-of-ai.svg"><div class="name">EYE OF AI</div></div>
  <div class="card"><img src="08-hex-brain.svg"><div class="name">HEX BRAIN</div></div>
  <div class="card"><img src="09-lotus-bloom.svg"><div class="name">LOTUS BLOOM</div></div>
  <div class="card"><img src="10-quantum-knot.svg"><div class="name">QUANTUM KNOT</div></div>
</div>
</body>
</html>
